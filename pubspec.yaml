Munjez is a comprehensive daily task management app in Arabic, designed to help users organize their tasks, goals, appointments, and daily habits in a simple and professional way. The app includes task management, categories and tags, recurring tasks, reminders and notifications, a calendar, statistics, goals, search, backup and restore, full customization of appearance and themes, dark and light modes, and support for device permissions such as files, camera, and location when needed. The project is open-source and expandable, with a structured architecture and features for advertising and monetization. 
